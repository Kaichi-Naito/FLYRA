<!doctype html><meta charset="utf-8"><title>Admin tests</title><button id="run">Run admin tests</button><pre id="results">Ready</pre><iframe style="width:1050px;height:850px"></iframe><script>
document.querySelector('#run').onclick=async()=>{const frame=document.querySelector('iframe'),out=document.querySelector('#results'),lines=[];let passed=0,failed=0;const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(n,v)=>{v?passed++:failed++;lines.push((v?'PASS ':'FAIL ')+n);out.textContent=lines.join('\n')+'\n'+passed+' passed / '+failed+' failed';};
try{await new Promise(r=>{frame.onload=r;frame.src='admin.html';});const w=frame.contentWindow,d=frame.contentDocument;check('editor disabled until connection',d.querySelector('#editor').disabled);let captured;
w.FlyraRepository=class{constructor(){this.head='test';this.files=[{path:'assets/icons/test.png',sha:'image'}];this.config={version:1,categories:[{id:'live',name:'ライブ'},{id:'goods',name:'グッズ'}],templates:{}};this.manifest=[{id:'test',name:'Test',folder:'icons',file:'icons/test.png',opacity:1,blend:'source-over'}];}async load(){return this;}async save(...args){captured=args;return 'saved';}disconnect(){}};
d.querySelector('#token').value='test-not-a-real-token';d.querySelector('#connect').click();await wait(80);check('credentials removed from input',d.querySelector('#token').value==='');check('all templates editable',d.querySelectorAll('#templateSettings select').length===w.Flyra.templates.length);
const category=d.querySelector('#templateSettings select');category.value='goods';category.dispatchEvent(new w.Event('change'));const folder=d.querySelector('#assetSettings select');folder.value='textures';folder.dispatchEvent(new w.Event('change'));const name=d.querySelector('#assetSettings input[type=text]');name.value='Renamed';name.dispatchEvent(new w.Event('input'));d.querySelector('#assetSettings input[type=checkbox]').click();
const c=d.createElement('canvas');c.width=c.height=5;const blob=await new Promise(r=>c.toBlob(r));const transfer=new w.DataTransfer();transfer.items.add(new w.File([blob],'new.png',{type:'image/png'}));d.querySelector('#upload').files=transfer.files;d.querySelector('#upload').dispatchEvent(new w.Event('change'));await wait(150);d.querySelector('#save').click();await wait(80);
check('template override saved',captured[0].templates[w.Flyra.templates[0].id].category==='goods');check('asset rename and visibility saved',captured[1][0].name==='Renamed'&&captured[1][0].hidden);check('folder move is Git tree move',captured[2].some(x=>x.path==='assets/textures/test.png'&&x.sha==='image')&&captured[2].some(x=>x.path==='assets/icons/test.png'&&x.sha===null));check('upload includes bytes and matching manifest',captured[1].length===2&&captured[2].some(x=>x.base64&&x.path==='assets/'+captured[1][1].file));check('upload has name hash',captured[1][1].sha256.length===64);check('success status',d.querySelector('#status').textContent.includes('保存しました'));
d.querySelector('#disconnect').click();check('disconnect disables editor',d.querySelector('#editor').disabled);
}catch(e){check(e.stack,false);}};
</script>
