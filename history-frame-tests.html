<!doctype html><meta charset="utf-8"><title>History and frame tests</title><button id="run">Run history and frame tests</button><pre id="results">Ready</pre><iframe style="width:1450px;height:900px"></iframe><script>
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#results'),f=document.querySelector('iframe'),lines=[];let pass=0,fail=0;const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(n,v)=>{v?pass++:fail++;lines.push((v?'PASS ':'FAIL ')+n);out.textContent=lines.join('\n')+'\n'+pass+' passed / '+fail+' failed';};
try{await new Promise(r=>{f.onload=r;f.src='index.html';});const w=f.contentWindow,d=f.contentDocument;for(let i=0;i<100&&!d.querySelector('.template-card');i++)await wait(100);const F=w.Flyra,c=d.createElement('canvas');c.width=800;c.height=400;c.getContext('2d').fillRect(0,0,800,400);const p=F.makeProject();p.layers=[F.layer('image',100,100,400,600,{name:'Photo',frameName:'Arch frame',slot:true,photoWindow:true,mask:'arch',src:c.toDataURL(),fit:'cover',cropZoom:1,cropX:0,cropY:0,brightness:100,contrast:100,grayscale:0})];
const data=new w.DataTransfer();data.items.add(new w.File([JSON.stringify(p)],'test.flyra',{type:'application/json'}));const inp=d.querySelector('#projectInput');inp.files=data.files;inp.dispatchEvent(new w.Event('change'));await wait(150);
const click=s=>d.querySelector(s).click(),key=async(el,shift=false)=>{el.focus();el.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',ctrlKey:true,shiftKey:shift,bubbles:true,cancelable:true}));await wait(120);},get=k=>d.querySelector('[data-prop="'+k+'"]'),edit=(k,v)=>{get(k).value=v;get(k).dispatchEvent(new w.Event('input',{bubbles:true}));get(k).dispatchEvent(new w.Event('change',{bubbles:true}));};
check('parent and child rows',d.querySelectorAll('.layer-row').length===1&&d.querySelectorAll('.layer-child').length===1);click('[aria-label="レイヤー Arch frame"]');check('parent controls frame only',!!get('w')&&!get('cropX'));edit('w',500);await key(get('w'));check('undo from numeric input',get('w').value==='400');await key(get('w'),true);check('redo from numeric input',get('w').value==='500');
get('w').value='650';get('w').dispatchEvent(new w.Event('input',{bubbles:true}));await key(get('w'));check('undo uncommitted numeric input',get('w').value==='500');
const title=d.querySelector('#projectName'),oldTitle=title.value;title.value='Changed';title.dispatchEvent(new w.Event('input',{bubbles:true}));await key(title);check('undo project name while typing',title.value===oldTitle);
click('[aria-label="枠内画像 Photo"]');check('child controls photo only',!!get('cropX')&&!get('w'));edit('cropZoom',2);await key(get('cropZoom'));check('undo from live crop input',get('cropZoom').value==='1');
edit('brightness',150);click('[data-prop="fit"] + .preview-select');await key(d.activeElement);check('undo from dropdown',get('brightness').value==='100'&&!d.querySelector('.preview-menu'));
const art=d.querySelector('#artboard');art.setPointerCapture=()=>{};const r=art.getBoundingClientRect(),send=(type,x,y)=>art.dispatchEvent(new w.PointerEvent(type,{pointerId:1,button:0,bubbles:true,clientX:r.left+x*r.width/p.width,clientY:r.top+y*r.height/p.height}));send('pointerdown',300,300);send('pointermove',370,300);send('pointerup',370,300);check('child canvas drag adjusts crop',Number(get('cropX').value)>0);click('[aria-label="レイヤー Arch frame"]');check('child drag keeps frame position',get('x').value==='100'&&get('w').value==='500');
click('[aria-label="枠内画像 Photo"]');click('#deleteLayer');check('remove photo keeps empty frame',d.querySelectorAll('.layer-row').length===1&&!d.querySelector('.layer-child'));await key(d.body);check('undo restores embedded image',!!d.querySelector('.layer-child'));
await wait(500);const db=await new Promise(resolve=>{const q=w.indexedDB.open('flyra-studio',2);q.onsuccess=()=>resolve(q.result);});const saved=await new Promise(resolve=>{const q=db.transaction('projects').objectStore('projects').get('current');q.onsuccess=()=>resolve(q.result);});db.close();check('hierarchy survives validation/save',F.validate(saved).layers[0].frameName==='Arch frame'&&saved.layers[0].slot);
}catch(e){check(e.stack,false);}};
</script>
