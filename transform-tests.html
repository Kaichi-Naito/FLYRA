<!doctype html><meta charset="utf-8"><title>FLYRA transform tests</title><button id="run">Run transform tests</button><pre id="results">Ready</pre><iframe style="width:1450px;height:900px"></iframe>
<script>
document.querySelector('#run').onclick=async()=>{
const out=document.querySelector('#results'),frame=document.querySelector('iframe'),lines=[];let pass=0,fail=0;const check=(name,ok)=>{ok?pass++:fail++;lines.push((ok?'PASS ':'FAIL ')+name);out.textContent=lines.join('\n')+'\n'+pass+' passed / '+fail+' failed';},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
await new Promise(r=>{frame.onload=r;frame.src='index.html';});const w=frame.contentWindow,d=frame.contentDocument;for(let i=0;i<100&&!d.querySelector('.template-card');i++)await wait(100);
const F=w.Flyra,click=s=>d.querySelector(s).click(),get=(key,type='number')=>d.querySelector('[data-prop="'+key+'"][type="'+type+'"]'),event=(el,name)=>el.dispatchEvent(new w.Event(name,{bubbles:true})),canvas=()=>d.querySelector('#artboard').toDataURL();
for(const rotation of [0,35,90,220])for(const sx of [-1,1])for(const sy of [-1,1]){const o={x:100,y:100,w:200,h:100,rotation},n={...o,...F.resizeCorner(o,40,25,sx,sy,true)},a=F.worldPoint(o,sx<0?o.w:0,sy<0?o.h:0),b=F.worldPoint(n,sx<0?n.w:0,sy<0?n.h:0);check('anchored proportional corner '+[rotation,sx,sy],Math.hypot(a.x-b.x,a.y-b.y)<.0001&&Math.abs(n.w/n.h-2)<.0001);}
click('[data-template="riso"]');await wait(200);click('[aria-label="レイヤー タイトル"]');await wait(200);
check('rotation range 0–360',get('rotation').min==='0'&&get('rotation').max==='360');check('opacity percent range',get('opacity').max==='100');
let before=canvas(),old=get('rotation').value;get('rotation','range').value='45';event(get('rotation','range'),'input');await wait(80);check('rotation changes before release',canvas()!==before&&get('rotation').value==='45');get('rotation','range').value='70';event(get('rotation','range'),'input');event(get('rotation','range'),'change');click('#undo');await wait(100);click('[aria-label="レイヤー タイトル"]');await wait(80);check('one undo restores whole slider gesture',get('rotation').value===old);
get('rotation').value='360';event(get('rotation'),'input');event(get('rotation'),'change');check('360 numeric value retained',get('rotation').value==='360');
before=canvas();get('opacity').value='25';event(get('opacity'),'input');await wait(80);check('numeric opacity previews immediately',canvas()!==before&&get('opacity','range').value==='25');event(get('opacity'),'change');
await wait(100);before=canvas();get('rotation','range').value='90';event(get('rotation','range'),'input');await wait(80);get('rotation','range').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await wait(80);check('Escape restores adjustment',get('rotation').value==='360'&&canvas()===before);
const fixture=F.makeProject();fixture.width=1080;fixture.height=1350;fixture.layers=[F.layer('rect',300,400,300,160,{name:'Gesture test',color:'#ff0088'})];const transfer=new w.DataTransfer();transfer.items.add(new w.File([JSON.stringify(fixture)],'fixture.flyra',{type:'application/json'}));d.querySelector('#projectInput').files=transfer.files;event(d.querySelector('#projectInput'),'change');await wait(200);click('[aria-label="レイヤー Gesture test"]');const art=d.querySelector('#artboard');art.setPointerCapture=()=>{};const val=k=>Number(get(k).value),ptr=(type,p,extra={})=>{const r=art.getBoundingClientRect();art.dispatchEvent(new w.PointerEvent(type,{clientX:r.left+p.x*r.width/1080,clientY:r.top+p.y*r.width/1080,pointerId:1,button:0,bubbles:true,...extra}));};
const edit=(k,v)=>{get(k).value=v;event(get(k),'change');};edit('rotation',0);edit('x',300);edit('y',400);edit('w',300);edit('h',160);
let o={x:val('x'),y:val('y'),w:val('w'),h:val('h'),rotation:0};let u=1080/art.getBoundingClientRect().width,h=F.rotationHandle(o,u,1080,1350),p=F.worldPoint(o,h.x,h.y);ptr('pointerdown',p);ptr('pointermove',{x:450+Math.abs(p.y-480),y:480},{shiftKey:true});await wait(80);check('canvas rotation handle live',Math.abs(val('rotation')-90)<.1);ptr('pointerup',p);
edit('rotation',0);o={x:val('x'),y:val('y'),w:val('w'),h:val('h'),rotation:0};p={x:o.x,y:o.y};ptr('pointerdown',p);ptr('pointermove',{x:p.x-60,y:p.y-32},{shiftKey:true});await wait(80);check('top left resize live',val('w')>o.w&&Math.abs(val('w')/val('h')-o.w/o.h)<.01);ptr('pointerup',p);
o={x:val('x'),y:val('y'),w:val('w'),h:val('h'),rotation:0};p={x:o.x+o.w/2,y:o.y+o.h/2};ptr('pointerdown',p);ptr('pointermove',{x:543,y:p.y});await wait(80);check('horizontal center snap '+[val('x'),val('w')],Math.abs(val('x')+val('w')/2-540)<.01);ptr('pointercancel',p);check('cancel restores transform '+[val('x'),o.x],val('x')===o.x);
}catch(e){check('exception '+e.stack,false);}
};
</script>
