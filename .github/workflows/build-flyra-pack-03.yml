name: Build FLYRA asset pack 03
on:
  push:
    branches: [assets/flyra-y2k-pack-03]
    paths:
      - generate-pack-03.py
      - assets/manifest.json
      - assets/PACK-03.md
      - .github/workflows/build-flyra-pack-03.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: python generate-pack-03.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node build-assets.cjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons assets/textures assets/catalog.js assets/catalog-2.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate FLYRA Y2K asset pack 03"
          git push
