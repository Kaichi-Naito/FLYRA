<!doctype html><meta charset="utf-8"><title>Layer drag tests</title><button id="run">Run layer drag tests</button><pre id="results">Ready</pre><iframe style="width:1450px;height:850px"></iframe>
<script>
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#results'),f=document.querySelector('iframe'),lines=[];let pass=0,fail=0;const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(n,v)=>{v?pass++:fail++;lines.push((v?'PASS ':'FAIL ')+n);out.textContent=lines.join('\n')+'\n'+pass+' passed / '+fail+' failed';};
try{await new Promise(r=>{f.onload=r;f.src='index.html';});const w=f.contentWindow,d=f.contentDocument;for(let i=0;i<100&&!d.querySelector('.template-card');i++)await wait(100);const F=w.Flyra,p=F.makeProject();p.layers=['A','B','C'].map((name,i)=>F.layer('rect',100,100,300,300,{name,color:['#ff0000','#00ff00','#0000ff'][i],locked:name==='B'}));const data=new w.DataTransfer();data.items.add(new w.File([JSON.stringify(p)],'test.flyra',{type:'application/json'}));const inp=d.querySelector('#projectInput');inp.files=data.files;inp.dispatchEvent(new w.Event('change'));await wait(150);
const rows=()=>[...d.querySelectorAll('.layer-row')],order=()=>rows().map(r=>r.querySelector('.layer-name').textContent).join(''),row=n=>rows().find(r=>r.querySelector('.layer-name').textContent===n);const drag=new w.DataTransfer();const ev=(target,type,y)=>target.dispatchEvent(new w.DragEvent(type,{bubbles:true,cancelable:true,dataTransfer:drag,clientY:y}));
check('locked source disabled',!row('B').draggable);let r=row('C').getBoundingClientRect();ev(row('A'),'dragstart',r.top);ev(row('C'),'dragover',r.top+2);check('drop indicator',row('C').classList.contains('drop-before'));check('no mutation during drag',order()==='CBA');ev(row('C'),'drop',r.top+2);await wait(80);check('bottom to top',order()==='ACB');check('selection follows layer',row('A').classList.contains('selected'));check('indicator cleaned',!d.querySelector('.drop-before,.drop-after,.layer-dragging'));d.querySelector('#undo').click();await wait(100);check('one undo restores order',order()==='CBA');d.querySelector('#redo').click();await wait(100);check('redo restores move',order()==='ACB');
r=row('B').getBoundingClientRect();ev(row('A'),'dragstart',r.bottom);ev(row('B'),'drop',r.bottom-1);await wait(80);check('top to bottom',order()==='CBA');ev(row('A'),'dragstart',r.top);ev(row('C'),'dragover',row('C').getBoundingClientRect().top+1);ev(row('A'),'dragend',r.top);check('cancel leaves order',order()==='CBA'&&!d.querySelector('.drop-before'));ev(row('C'),'drop',row('C').getBoundingClientRect().top);check('external drop ignored',order()==='CBA');
await wait(500);const db=await new Promise(resolve=>{const q=w.indexedDB.open('flyra-studio',2);q.onsuccess=()=>resolve(q.result);});const saved=await new Promise(resolve=>{const q=db.transaction('projects').objectStore('projects').get('current');q.onsuccess=()=>resolve(q.result);});db.close();check('saved stacking order',saved.layers.map(o=>o.name).join('')==='ABC');
}catch(e){check(e.stack,false);}};
</script>
