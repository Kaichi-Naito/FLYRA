<!doctype html><meta charset="utf-8"><title>Sticker and foil checks</title>
<style>body{background:#777;color:white;font:16px sans-serif}canvas{width:310px;margin:10px;background:repeating-conic-gradient(#555 0% 25%,#777 0% 50%) 0/20px 20px}iframe{width:1400px;height:950px}</style>
<pre id="results">Running…</pre><div id="gallery"></div><iframe id="app" src="index.html"></iframe>
<script src="engine.js"></script><script src="transforms.js"></script><script src="fonts.js"></script><script src="effects.js"></script><script src="templates.js"></script><script src="templates-02.js"></script><script src="hologram.js"></script><script src="barcode-stickers.js"></script><script src="mirror.js"></script>
<script>
const out=document.querySelector('#results'),lines=[];const check=(v,s)=>{if(!v)throw Error(s);lines.push('PASS '+s);out.textContent=lines.join('\n');};const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{const F=Flyra,m=await(await fetch('assets/manifest.json')).json();const assets=m.filter(a=>a.folder==='barcodes');check(assets.length===3,'three barcode assets');
for(const a of assets){const blob=await(await fetch('assets/'+a.file)).blob(),src=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob);});const im=await F.loadImage(src),o=F.layer('image',0,0,im.width,im.height,{name:a.name,src,fit:'contain',mask:'rect',stickerKind:a.stickerKind,...F.stickerDefaults[a.stickerKind]});const p=F.makeProject();p.width=im.width;p.height=im.height;p.layers=[o];const canvas=document.createElement('canvas');canvas.width=im.width;canvas.height=im.height;const images=new Map([[src,im]]);F.render(canvas,p,{images,transparent:true});const original=canvas.toDataURL();o.stickerTitle='EDIT TEST';F.render(canvas,p,{images,transparent:true});check(original!==canvas.toDataURL(),a.stickerKind+' text changes pixels');check(F.validate(p).layers[0].stickerTitle==='EDIT TEST',a.stickerKind+' saved editable');o.stickerTitle=F.stickerDefaults[a.stickerKind].stickerTitle;F.render(canvas,p,{images,transparent:true});check(canvas.getContext('2d').getImageData(0,0,1,1).data[3]===0,a.stickerKind+' transparent edge');document.querySelector('#gallery').append(canvas);}
for(const type of ['rect','ellipse','star','text','gradient'])for(const finish of ['holo','pearl']){const p=F.makeProject();p.width=p.height=500;p.layers=[F.layer(type,40,40,420,420,{colorFinish:finish,text:'HOLO',font:'sans',fontSize:90,fontWeight:700,lineHeight:1.1,align:'center'})];const c=document.createElement('canvas');c.width=c.height=500;F.render(c,p,{transparent:true});const d=c.getContext('2d').getImageData(0,0,500,500).data;const colors=new Set();for(let i=0;i<d.length;i+=80)if(d[i+3])colors.add(d[i]+','+d[i+1]+','+d[i+2]);check(colors.size>10,type+' '+finish+' multicolor');check(F.validate(p).layers[0].colorFinish===finish,'finish survives validation');document.querySelector('#gallery').append(c);}
const frame=document.querySelector('#app');while(!frame.contentWindow.Flyra?.stickerDefaults||!frame.contentDocument.querySelector('.template-card'))await wait(100);const d=frame.contentDocument,w=frame.contentWindow;d.querySelector('[data-panel="assets"]').click();const folder=d.querySelector('#assetFolder');folder.value='barcodes';folder.dispatchEvent(new Event('change',{bubbles:true}));check(d.querySelectorAll('.asset-card').length===3,'shelf folder lists three stickers');d.querySelector('.asset-card').click();d.querySelector('#addSelectedAssets').click();while(!d.querySelector('[data-prop="stickerTitle"]'))await wait(100);let field=d.querySelector('[data-prop="stickerTitle"]');const previous=field.value;field.value='ユーザー編集';field.dispatchEvent(new Event('input',{bubbles:true}));field.dispatchEvent(new Event('change',{bubbles:true}));d.querySelector('#undo').click();await wait(200);check(d.querySelector('[data-prop="stickerTitle"]').value===previous,'undo sticker text');d.querySelector('#redo').click();await wait(200);check(d.querySelector('[data-prop="stickerTitle"]').value==='ユーザー編集','redo sticker text');const beforeCount=Number(d.querySelector('#layerCount').textContent),oldX=Number(d.querySelector('[data-prop="x"]').value),width=Number(d.querySelector('[data-prop="w"]').value);d.querySelector('#mirrorLayer').click();check(Number(d.querySelector('#layerCount').textContent)===beforeCount+1,'mirror adds one layer');check(Math.abs(Number(d.querySelector('[data-prop="x"]').value)-(1080-oldX-width))<=2,'mirror position across center');d.querySelector('#undo').click();await wait(200);check(Number(d.querySelector('#layerCount').textContent)===beforeCount,'mirror undo atomic');d.querySelector('#redo').click();await wait(200);d.querySelector('#layerList .layer-name').click();const art=d.querySelector('#artboard'),rect=art.getBoundingClientRect();const sx=Number(d.querySelector('[data-prop="x"]').value),sy=Number(d.querySelector('[data-prop="y"]').value),sw=Number(d.querySelector('[data-prop="w"]').value),sh=Number(d.querySelector('[data-prop="h"]').value);const cx=rect.left+(sx+sw/2)/1080*rect.width,cy=rect.top+(sy+sh/2)/1350*rect.height;const failures=[];w.addEventListener('error',e=>failures.push(e.message));art.setPointerCapture=()=>{};const fire=(type,x,y)=>art.dispatchEvent(new w.PointerEvent(type,{clientX:x,clientY:y,button:0,buttons:1,pointerId:1,bubbles:true,altKey:true}));const beforePixels=art.toDataURL();fire('pointerdown',cx,cy);fire('pointermove',cx+35,cy+20);await wait(150);check(art.toDataURL()!==beforePixels,'pixels move BEFORE pointerup');check(failures.length===0,'no undefined crop-value error during drag');fire('pointerup',cx+35,cy+20);const original=F.layer('triangle',40,80,130,100,{rotation:27}),mirrored=F.mirrorLayer(original,500);check(mirrored.x===330&&mirrored.rotation===-27&&mirrored.flipX,'mirror geometry and orientation');check(F.mirrorLayer(mirrored,500).x===40&&!F.mirrorLayer(mirrored,500).flipX,'double mirror restores orientation');out.textContent+='\nALL CHECKS PASSED';})().catch(e=>out.textContent+='\nFAIL '+e.stack);
</script>
