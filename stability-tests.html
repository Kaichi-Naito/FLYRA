<!doctype html><meta charset="utf-8"><title>Stability tests</title><button id="run">Run stability tests</button><pre id="results">Ready</pre><iframe style="width:1450px;height:900px"></iframe><script>
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#results'),f=document.querySelector('iframe'),lines=[];let pass=0,fail=0;const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(n,v)=>{v?pass++:fail++;lines.push((v?'PASS ':'FAIL ')+n);out.textContent=lines.join('\n')+'\n'+pass+' passed / '+fail+' failed';};
try{await new Promise(r=>{f.onload=r;f.src='index.html';});const w=f.contentWindow,d=f.contentDocument;for(let i=0;i<100&&!d.querySelector('.template-card');i++)await wait(100);const F=w.Flyra,c=d.createElement('canvas');c.width=c.height=512;const cx=c.getContext('2d'),pixels=cx.createImageData(512,512);for(let i=0;i<pixels.data.length;i+=4){pixels.data[i]=Math.random()*255;pixels.data[i+1]=Math.random()*255;pixels.data[i+2]=Math.random()*255;pixels.data[i+3]=255;}cx.putImageData(pixels,0,0);const src=c.toDataURL();
const p=F.makeProject();p.layers=Array.from({length:8},(_,i)=>F.layer('image',100,100,400,400,{name:'Image '+i,src,fit:'cover',mask:'rect',userAdded:true}));
const dt=new w.DataTransfer();dt.items.add(new w.File([JSON.stringify(p)],'test.flyra',{type:'application/json'}));d.querySelector('#projectInput').files=dt.files;d.querySelector('#projectInput').dispatchEvent(new w.Event('change'));await wait(300);d.querySelector('[aria-label="レイヤー Image 7"]').click();
for(let i=1;i<=12;i++){const input=d.querySelector('[data-prop="w"]');input.value=400+i;input.dispatchEvent(new w.Event('change'));}const key=shift=>d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'z',ctrlKey:true,shiftKey:shift,bubbles:true,cancelable:true}));
for(let i=0;i<12;i++)key(false);await wait(250);check('12 rapid undo operations with large image project',d.querySelector('[data-prop="w"]').value==='400');for(let i=0;i<12;i++)key(true);await wait(250);check('12 redo operations',d.querySelector('[data-prop="w"]').value==='412');
const same=d.querySelector('[data-prop="w"]');same.dispatchEvent(new w.Event('change'));key(false);await wait(120);check('no-op changes do not consume undo',d.querySelector('[data-prop="w"]').value==='411');
const area=d.querySelector('#canvasArea'),art=d.querySelector('#artboard'),r=area.getBoundingClientRect();let blank=0;for(let i=0;i<5;i++){area.dispatchEvent(new w.WheelEvent('wheel',{deltaY:-80,clientX:r.left+r.width/2,clientY:r.top+r.height/2,bubbles:true,cancelable:true}));await new Promise(resolve=>w.requestAnimationFrame(()=>{const a=art.getContext('2d').getImageData(0,0,1,1).data[3];if(a===0)blank++;resolve();}));await wait(50);}check('canvas stays painted between zoom frames',blank===0);
const source=F.makeProject('night-window');source.layers=source.layers.filter(o=>o.slot).slice(0,1);Object.assign(source.layers[0],{type:'image',src,name:'Carry photo',fit:'cover',userAdded:true,cropZoom:2,cropX:.5});const sourceId=source.layers[0].id;
for(const t of F.templates){const expected=F.makeProject(t.id,source.content,source.width,source.height,123),slots=expected.layers.filter(o=>o.slot),next=F.applyTemplate(source,t.id,123);if(!slots.length){check('no-frame retains photo '+t.id,next.layers.some(o=>o.src===src));continue;}const filled=next.layers.filter(o=>o.slot&&o.type==='image');check('photo fills new template '+t.id,filled.length===slots.length&&filled.every((o,i)=>o.src===src&&o.mask===(slots[i].mask||'rect')&&o.w===slots[i].w&&o.x===slots[i].x&&o.cropZoom===1)&&!next.layers.some(o=>o.id===sourceId));F.validate(next);}
source.layers[0].locked=true;const locked=F.applyTemplate(source,'orbit-paper',123);check('locked frame preserved',locked.layers.some(o=>o.id===sourceId&&o.locked&&o.cropZoom===2));
}catch(e){check(e.stack,false);}};
</script>
