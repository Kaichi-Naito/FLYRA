<!doctype html><meta charset="utf-8"><title>Photo frame tests</title><button id="run">Run photo frame tests</button><pre id="results">Ready</pre><iframe style="width:1450px;height:900px"></iframe>
<script>
document.querySelector('#run').onclick=async()=>{
const out=document.querySelector('#results'),frame=document.querySelector('iframe');let pass=0,fail=0;const lines=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(n,v)=>{v?pass++:fail++;lines.push((v?'PASS ':'FAIL ')+n);out.textContent=lines.join('\n')+'\n'+pass+' passed / '+fail+' failed';};
try{await new Promise(r=>{frame.onload=r;frame.src='index.html';});const w=frame.contentWindow,d=frame.contentDocument;for(let i=0;i<100&&!d.querySelector('.template-card');i++)await wait(100);const F=w.Flyra,p=F.makeProject();p.width=1080;p.height=1350;p.layers=[F.layer('rect',100,100,600,800,{name:'Test arch',slot:true,photoWindow:true,mask:'arch'})];
const input=d.querySelector('#projectInput'),dt=new w.DataTransfer();dt.items.add(new w.File([JSON.stringify(p)],'test.flyra',{type:'application/json'}));input.files=dt.files;input.dispatchEvent(new w.Event('change'));await wait(150);
const c=d.createElement('canvas');c.width=300;c.height=200;c.getContext('2d').fillStyle='#ff0088';c.getContext('2d').fillRect(0,0,300,200);const blob=await new Promise(r=>c.toBlob(r));const files=new w.DataTransfer();files.items.add(new w.File([blob],'Photo.png',{type:'image/png'}));const art=d.querySelector('#artboard'),r=art.getBoundingClientRect();d.querySelector('#canvasArea').dispatchEvent(new w.DragEvent('drop',{dataTransfer:files,clientX:r.left+400*r.width/1080,clientY:r.top+500*r.width/1080,bubbles:true}));await wait(650);
const db=await new Promise(resolve=>{const q=w.indexedDB.open('flyra-studio',2);q.onsuccess=()=>resolve(q.result);});const saved=await new Promise(resolve=>{const q=db.transaction('projects').objectStore('projects').get('current');q.onsuccess=()=>resolve(q.result);});db.close();const o=saved.layers[0];check('drop replaces frame rather than adds layer',saved.layers.length===1&&o.type==='image');check('frame shape and geometry preserved',o.mask==='arch'&&o.x===100&&o.y===100&&o.w===600&&o.h===800);check('cover and crop controls initialized',o.fit==='cover'&&o.cropZoom===1&&o.cropX===0);check('saved project validates',F.validate(saved).layers[0].mask==='arch');check('crop controls available',!!d.querySelector('[data-prop="cropX"]'));
const images=await F.prepare(saved),outCanvas=d.createElement('canvas');outCanvas.width=600;outCanvas.height=800;F.render(outCanvas,{...saved,width:600,height:800,layers:[{...o,x:0,y:0}]},{images,transparent:true});const ctx=outCanvas.getContext('2d');check('arch clips top corners',ctx.getImageData(0,0,1,1).data[3]===0);check('photo fills arch center',ctx.getImageData(300,400,1,1).data[3]===255);
let picked=false;d.querySelector('#imageInput').click=()=>{picked=true;};art.dispatchEvent(new w.MouseEvent('dblclick',{clientX:r.left+400*r.width/1080,clientY:r.top+500*r.width/1080,bubbles:true}));check('double click opens photo replacement',picked);
}catch(e){check(e.stack,false);}
};
</script>
