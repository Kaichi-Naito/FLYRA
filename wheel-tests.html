<!doctype html><meta charset="utf-8"><title>Wheel zoom tests</title><button id="run">Run wheel zoom tests</button><pre id="results">Ready</pre><iframe style="width:1450px;height:900px"></iframe><script>
document.querySelector('#run').onclick=async()=>{const out=document.querySelector('#results'),f=document.querySelector('iframe'),lines=[];let pass=0,fail=0;const wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(n,v)=>{v?pass++:fail++;lines.push((v?'PASS ':'FAIL ')+n);out.textContent=lines.join('\n')+'\n'+pass+' passed / '+fail+' failed';};
try{await new Promise(r=>{f.onload=r;f.src='index.html';});const w=f.contentWindow,d=f.contentDocument;for(let i=0;i<100&&!d.querySelector('.template-card');i++)await wait(100);const art=d.querySelector('#artboard'),area=d.querySelector('#canvasArea'),fit=d.querySelector('#zoomFit'),rect=()=>art.getBoundingClientRect();fit.click();await wait(80);const original=rect().width,undo=d.querySelector('#undo').disabled,info=d.querySelector('#canvasInfo').textContent;
const wheel=async(delta,mode=0,target=area)=>{const r=area.getBoundingClientRect();const e=new w.WheelEvent('wheel',{deltaY:delta,deltaMode:mode,clientX:r.left+r.width/2,clientY:r.top+r.height/2,bubbles:true,cancelable:true});target.dispatchEvent(e);await wait(150);return e.defaultPrevented;};
check('wheel captured only in preview',await wheel(-120));check('up enlarges '+rect().width+' / '+original,rect().width>original);await wheel(120);check('down shrinks',Math.abs(rect().width-original)<1);await wheel(-3,1);check('line delta supported',rect().width>original);fit.click();await wait(150);
await wheel(-120);await wheel(-120);await wheel(-120);await wheel(-120);const v=area.getBoundingClientRect(),x=v.left+v.width/2,y=v.top+v.height/2,b=rect(),fx=(x-b.left)/b.width,fy=(y-b.top)/b.height;await wheel(-120);const a=rect();check('cursor anchor when scrollable',Math.abs(a.left+fx*a.width-x)<2&&Math.abs(a.top+fy*a.height-y)<2);
for(let i=0;i<12;i++)await wheel(-120);check('upper zoom limit '+rect().width/original,Math.abs(rect().width/original-3)<.02);for(let i=0;i<20;i++)await wheel(120);check('lower zoom limit',Math.abs(rect().width/original-.4)<.02);const small=rect().width;await wheel(-120,0,d.querySelector('#layerList'));check('side panel wheel does not zoom',Math.abs(rect().width-small)<1);fit.click();await wait(150);check('fit restores view',Math.abs(rect().width-original)<1);check('zoom does not change project or undo',d.querySelector('#canvasInfo').textContent===info&&d.querySelector('#undo').disabled===undo);
}catch(e){check(e.stack,false);}};
</script>
