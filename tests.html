<!doctype html><html lang="ja"><meta charset="utf-8"><title>FLYRA Engine Tests</title><style>body{font:14px monospace;background:#f4f4ed;padding:30px}li{margin:8px}.pass{color:#166845}.fail{color:#b3261e}</style><h1>FLYRA rendering / data tests</h1><p id="summary">Running…</p><ol id="results"></ol><script src="engine.js"></script><script src="effects.js"></script><script src="templates.js"></script><script>
(async()=>{const F=Flyra;let pass=0,fail=0;const assert=(x,m)=>{if(!x)throw Error(m||'Assertion failed');};async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS '+name;li.className='pass';pass++;}catch(e){li.textContent='FAIL '+name+': '+e.message;li.className='fail';fail++;}document.getElementById('results').append(li);}
const cv=(w=100,h=100)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};const pixel=(c,x=0,y=0)=>[...c.getContext('2d').getImageData(x,y,1,1).data];
await test('All 12 templates validate, render, serialize and export',()=>{for(const t of F.templates){const p=F.validate(JSON.parse(JSON.stringify(F.makeProject(t.id))));const c=cv(216,270);F.render(c,p);assert(pixel(c)[3]===255,t.id+' background is transparent');assert(c.toDataURL('image/png').length>1000);}});
await test('Solid background exactly matches specified color',()=>{const p=F.makeProject();p.layers=[];p.background.color='#ff8040';const c=cv();F.render(c,p);assert(JSON.stringify(pixel(c))==='[255,128,64,255]');});
await test('Transparent export excludes only background',()=>{const p=F.makeProject();p.layers=[];const c=cv();F.render(c,p,{transparent:true});assert(pixel(c)[3]===0);});
await test('All 18 blend modes render and survive serialization',()=>{for(const [mode] of F.blends){const p=F.makeProject();p.layers=[F.layer('rect',0,0,p.width/2,p.height/2,{color:'#aa5577',blend:mode})];F.validate(p);const c=cv();F.render(c,p);assert(pixel(c,10,10)[3]===255,mode);}});
await test('Hard Mix binary channels and opacity math',()=>{assert(F.hardMixChannel(50,200)===0);assert(F.hardMixChannel(100,200)===255);const b=new Uint8ClampedArray([100,100,100,255]);F.hardMixPixels(b,new Uint8ClampedArray([200,0,200,255]),.5);assert(JSON.stringify([...b])==='[178,50,178,255]');});
await test('Hard Mix transparent foreground leaves backdrop unchanged',()=>{const b=new Uint8ClampedArray([91,104,212,255]);F.hardMixPixels(b,new Uint8ClampedArray([255,255,255,0]),1);assert(JSON.stringify([...b])==='[91,104,212,255]');});
await test('Hard Mix above a transparent backdrop retains source color',()=>{const b=new Uint8ClampedArray([0,0,0,0]);F.hardMixPixels(b,new Uint8ClampedArray([80,130,210,255]),1);assert(JSON.stringify([...b])==='[80,130,210,255]');});
await test('Hard Mix integration preserves untouched region',()=>{const p=F.makeProject();p.background.color='#6480c8';p.layers=[F.layer('rect',0,0,p.width/2,p.height/2,{color:'#c800c8',blend:'hard-mix'})];const c=cv();F.render(c,p);assert(JSON.stringify(pixel(c,10,10))==='[255,0,255,255]');assert(JSON.stringify(pixel(c,90,90))==='[100,128,200,255]');});
await test('Procedural textures are deterministic across renders',()=>{const p=F.makeProject();p.layers=[F.layer('grain',0,0,p.width,p.height,{color:'#000000',seed:17,density:30})];const a=cv(200,250),b=cv(200,250);F.render(a,p);F.render(b,p);assert(a.toDataURL()===b.toDataURL());});
await test('Locked content and user-added layers survive template changes',()=>{const p=F.makeProject();const title=p.layers.find(x=>x.role==='title');title.locked=true;title.text='KEEP';const custom=F.layer('ellipse',30,30,90,90,{userAdded:true});p.layers.push(custom);const next=F.applyTemplate(p,'merch',34);assert(next.layers.find(x=>x.id===title.id).text==='KEEP');assert(next.layers.find(x=>x.id===custom.id));assert(next.layers.filter(x=>x.role==='title').length===1);});
await test('Repeated template changes do not accumulate grain overlays',()=>{let p=F.makeProject();for(let i=0;i<30;i++)p=F.applyTemplate(p,['riso','zine','grunge'][i%3],i);assert(p.layers.filter(x=>x.type==='grain').length===1);});
await test('Rotated hit test and locked visibility selection rules',()=>{const o=F.layer('rect',10,10,100,40,{rotation:90});assert(F.hit(o,60,30));assert(!F.hit(o,12,12));o.locked=true;assert(!F.hit(o,60,30));});
await test('Resize scales geometry and font size',()=>{const p=F.makeProject();const old=F.clone(p.layers.find(o=>o.type==='text'));F.resizeProject(p,p.width*2,p.height*2);const now=p.layers.find(o=>o.id===old.id);assert(now.w===old.w*2&&now.fontSize===old.fontSize*2);});
await test('Malformed and external image project data is rejected',()=>{for(const key of ['width','height']){const p=F.makeProject();p[key]=Infinity;let caught=false;try{F.validate(p);}catch{caught=true;}assert(caught);}const p=F.makeProject();p.layers.push(F.layer('image',0,0,100,100,{src:'https://example.com/private.png',fit:'cover',mask:'rect'}));let caught=false;try{F.validate(p);}catch{caught=true;}assert(caught);});
await test('Every image effect and mask exports without taint',async()=>{const source=cv(100,100),cx=source.getContext('2d');cx.fillStyle='#808080';cx.fillRect(0,0,100,100);cx.clearRect(0,0,10,10);const src=source.toDataURL(),im=await F.loadImage(src),map=new Map([[src,im]]);for(const [effect] of F.imageEffects)for(const mask of ['rect','ellipse',...F.extraMasks.map(x=>x[0])]){const p=F.makeProject();p.layers=[F.layer('image',0,0,p.width,p.height,{src,fit:'cover',mask,effect,ink:'#000000',paper:'#ffffff'})];F.validate(p);const c=cv();F.render(c,p,{images:map,transparent:true});assert(c.toDataURL().length>100);}});
document.getElementById('summary').textContent=`${pass} passed / ${fail} failed`;document.title=`FLYRA tests: ${pass} passed, ${fail} failed`;
})();</script></html>
