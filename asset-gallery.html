<!doctype html><meta charset="utf-8"><title>FLYRA 素材一覧</title><style>body{font:14px Arial;background:#eee;padding:20px}#gallery{display:grid;grid-template-columns:repeat(6,180px);gap:14px}article{background:white;padding:8px}img{width:180px;height:150px;object-fit:contain;background:#444}p{font-size:12px}pre{white-space:pre-wrap}</style><h1>FLYRA 素材一覧</h1><pre id="results">読み込み中</pre><div id="gallery"></div>
<script src="engine.js"></script><script src="effects.js"></script><script src="asset-names.js"></script><script src="assets/catalog.js"></script><script src="assets/catalog-2.js"></script><script src="assets/catalog-3.js"></script><script>
(async()=>{let pass=0,fail=0;const out=document.querySelector('#results');for(const a of FLYRA_ASSETS){try{const im=await Flyra.loadImage(a.src),c=document.createElement('canvas');c.width=200;c.height=200;const p=Flyra.makeProject();p.layers=[Flyra.layer('image',0,0,p.width,p.height,{name:a.name,src:a.src,fit:'contain',mask:'rect',blend:a.blend,opacity:a.opacity})];Flyra.validate(p);Flyra.render(c,p,{images:new Map([[a.src,im]]),transparent:true});if(c.toDataURL().length<100)throw Error('export failed');const blob=await(await fetch(a.src)).blob();if(await Flyra.resolveAssetName(new File([blob],'download.png',{type:blob.type}))!==a.name)throw Error('name mismatch');pass++;const card=document.createElement('article'),image=document.createElement('img'),label=document.createElement('p');image.src=a.src;image.alt=a.name;label.textContent=a.name;card.append(image,label);document.querySelector('#gallery').append(card);}catch(e){fail++;out.textContent+='\nFAIL '+a.name+': '+e.message;}}out.textContent+='\n'+pass+'点：読み込み・描画・保存・名前復元OK / '+fail+'件の失敗';})();
</script>
