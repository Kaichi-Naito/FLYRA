<!doctype html><meta charset="utf-8"><title>Five portrait template</title><style>body{background:#444;color:white}canvas{width:540px;max-width:90vw}</style><pre id="results">Running</pre><canvas id="poster" width="1080" height="1350"></canvas>
<script src="engine.js"></script><script src="transforms.js"></script><script src="fonts.js"></script><script src="text-weight.js"></script><script src="effects.js"></script><script src="templates.js"></script><script src="templates-02.js"></script><script src="templates-five.js"></script><script src="content-kinds.js"></script><script src="hologram.js"></script><script src="vertical-text.js"></script><script src="mirror.js"></script><script src="favorites.js"></script>
<script>
(async()=>{const F=Flyra,t=F.templates.find(t=>t.id==='five-cut-live'),p=F.makeProject(t.id,{...F.defaultContent,...t.preview}),out=document.querySelector('#results'),check=(v,s)=>{if(!v)throw Error(s);out.textContent+='\nPASS '+s;};check(t.category==='live','live template');check(p.layers.filter(o=>o.slot).length===5,'five independent photo frames');check(new Set(p.layers.filter(o=>o.slot).map(o=>o.mask)).size===5,'five angled masks');check(F.validate(p).layers.length===p.layers.length,'template validates');await F.ensureProjectFonts(p);F.render(document.querySelector('#poster'),p);const image=document.createElement('canvas');image.width=100;image.height=200;image.getContext('2d').fillRect(0,0,100,200);const q=F.clone(p);for(const o of q.layers.filter(o=>o.slot)){o.type='image';o.src=image.toDataURL();o.fit='cover';}check(F.validate(q).layers.filter(o=>o.type==='image').length===5,'photo replacement validates');const photos=await F.prepare(q),canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;F.render(canvas,q,{images:photos});check(canvas.toDataURL()!==document.querySelector('#poster').toDataURL(),'photo replacements render');check(F.applyTemplate(q,'five-cut-live',2026).layers.filter(o=>o.slot&&o.type==='image').length===5,'five photos transfer to template');out.textContent+='\nALL PASSED';})().catch(e=>document.querySelector('#results').textContent+='\nFAIL '+e.stack);
</script>
